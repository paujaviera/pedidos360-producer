spring:
  application:
    name: pedidos360-backend
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://cognito-idp.us-east-1.amazonaws.com/us-east-1_dMgo1xJeL
  rabbitmq:
    host: ${RABBIT_HOST:localhost}
    port: ${RABBIT_PORT:5672}
    username: ${RABBIT_USER:guest}
    password: ${RABBIT_PASSWORD:guest}
    listener:
      simple:
        acknowledge-mode: manual
        default-requeue-rejected: false

server:
  port: 8888

app:
  rabbit:
    exchange:
      pedidos: pedidos.exchange
      dlx: pedidos.dlx
    queue:
      notificaciones: notificaciones.queue
      notificaciones-dlq: notificaciones.dlq
      tickets: tickets.queue
      tickets-dlq: tickets.dlq
      documentos: documentos.queue
      documentos-dlq: documentos.dlq
    routing-key:
      pedido-creado: pedido.creado
      pedido-estado: pedido.estado.cambiado
      notificaciones-binding: "pedido.#"
      notificaciones-dlq: notificaciones.dlq
      tickets-dlq: tickets.dlq
      documentos-dlq: documentos.dlq