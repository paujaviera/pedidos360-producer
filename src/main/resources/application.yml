spring:
  application:
    name: pedidos360-producer
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://cognito-idp.us-east-1.amazonaws.com/us-east-1_dMgo1xJeL
  rabbitmq:
    host: ${RABBIT_HOST:localhost}
    port: ${RABBIT_PORT:5672}
    username: ${RABBIT_USER:guest}
    password: ${RABBIT_PASSWORD:guest}
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:3306/${DB_NAME:pedidos360}
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

server:
  port: 8888

app:
  rabbit:
    exchange:
      pedidos: pedidos.exchange
    routing-key:
      pedido-creado: pedido.creado
      pedido-estado: pedido.estado.cambiado